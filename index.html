<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Factorización - Ingresa</title>
    <style>
        :root {
            --primary-navy: #0A2240; /* Azul marino del trazo */
            --primary-teal: #00D2A0; /* Turquesa del texto */
            --light-bg: #E8F4F8; /* Fondo claro inspirado en los flyers */
            --white: #FFFFFF;
            --text-dark: #333333;
            --error-red: #D32F2F; /* Rojo para retroalimentación */
            --success-green: #2E7D32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            background-image: linear-gradient(135deg, #E8F4F8 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        #game-container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 34, 64, 0.15);
            text-align: center;
            max-width: 650px;
            width: 90%;
            border-top: 6px solid var(--primary-teal);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 250px;
            height: auto;
        }

        #board-container {
            margin-bottom: 25px;
        }

        .equation-history {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
            min-height: 27px;
        }

        #board {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-navy);
            background-color: #F8FBFC;
            border: 2px dashed var(--primary-teal);
            padding: 20px;
            border-radius: 12px;
            word-wrap: break-word;
            letter-spacing: 2px;
        }

        #instruction {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--primary-navy);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background-color: var(--primary-navy);
            color: var(--white);
            border: 2px solid var(--primary-navy);
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) {
            background-color: var(--white);
            color: var(--primary-navy);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #B0BEC5;
            border-color: #B0BEC5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #feedback {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
        }

        .correct { color: var(--success-green); }
        .incorrect { color: var(--error-red); }

        #final-result {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--primary-navy);
            color: var(--white);
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 15px rgba(10, 34, 64, 0.3);
        }

        #final-result span {
            color: var(--primary-teal);
        }

        #restart-btn {
            margin-top: 20px;
            background-color: var(--primary-teal);
            border-color: var(--primary-teal);
            color: var(--primary-navy);
            display: none;
            width: 100%;
        }

        #restart-btn:hover {
            background-color: var(--primary-navy);
            color: var(--primary-teal);
            border-color: var(--primary-navy);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="logo-container">
        <!-- Asegúrate de que el archivo Ingresa_Cicle.jpg esté en la misma carpeta -->
        <img src="Ingresa_Cicle.jpg" alt="Logo Ingresa">
    </div>
    
    <div id="board-container">
        <div class="equation-history" id="history"></div>
        <div id="board"></div>
    </div>
    
    <div id="instruction"></div>
    <div class="options-grid" id="options"></div>
    <div id="feedback"></div>
    
    <div id="final-result"></div>
    <button id="restart-btn" onclick="initGame()">Jugar de Nuevo</button>
</div>

<script>
    // Configuración de límites de exponentes
    const PRIMES = [
        {base: 2, maxExp: 5},
        {base: 3, maxExp: 5},
        {base: 5, maxExp: 4},
        {base: 7, maxExp: 2},
        {base: 11, maxExp: 2}
    ];

    let currentChain = [];
    let historyStrings = [];

    const boardEl = document.getElementById("board");
    const historyEl = document.getElementById("history");
    const instructionEl = document.getElementById("instruction");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const finalResultEl = document.getElementById("final-result");
    const restartBtn = document.getElementById("restart-btn");

    function isPrime(num) {
        if (num <= 1) return false;
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i === 0) return false;
        }
        return true;
    }

    // Genera un número compuesto manejable basado en las reglas
    function generateInitialNumber() {
        let num = 1;
        let totalFactors = 0;
        
        // Forzamos que tenga entre 3 y 5 factores totales para un buen juego
        while (totalFactors < 3 || totalFactors > 5) {
            num = 1;
            totalFactors = 0;
            for (let p of PRIMES) {
                let exp = Math.floor(Math.random() * (p.maxExp + 1));
                if (totalFactors + exp > 5) exp = 5 - totalFactors; 
                num *= Math.pow(p.base, exp);
                totalFactors += exp;
            }
        }
        return { num, totalFactors };
    }

    // Obtiene todos los pares de divisores de un número
    function getDivisorPairs(num) {
        let pairs = [];
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i === 0) {
                pairs.push([i, num / i]);
            }
        }
        return pairs;
    }

    function formatExponents(chain) {
        let counts = {};
        chain.forEach(num => { counts[num] = (counts[num] || 0) + 1; });
        let primes = Object.keys(counts).map(Number).sort((a,b) => a-b);
        
        const superMap = {'2':'²','3':'³','4':'⁴','5':'⁵'};
        
        let parts = primes.map(p => {
            let count = counts[p];
            if (count === 1) return p.toString();
            let expStr = count.toString().split('').map(d => superMap[d] || d).join('');
            return `${p}${expStr}`;
        });
        return parts.join(" × ");
    }

    function initGame() {
        finalResultEl.style.display = "none";
        restartBtn.style.display = "none";
        historyStrings = [];
        
        let initialData = generateInitialNumber();
        currentChain = [initialData.num];
        historyStrings.push(initialData.num.toString());
        
        updateBoard();
        nextTurn();
    }

    function updateBoard() {
        boardEl.textContent = currentChain.join(" × ");
        if (historyStrings.length > 1) {
            // Mostrar la cadena de igualdades previas
            let displayHistory = historyStrings.slice(0, -1).join(" = ");
            if (displayHistory.length > 40) {
                displayHistory = "... = " + historyStrings[historyStrings.length - 2];
            }
            historyEl.textContent = displayHistory + " =";
        } else {
            historyEl.textContent = "";
        }
    }

    function nextTurn() {
        feedbackEl.textContent = "";
        feedbackEl.className = "";
        optionsEl.innerHTML = "";

        // Buscar el primer número compuesto en la cadena
        let targetIndex = currentChain.findIndex(n => !isPrime(n));

        if (targetIndex === -1) {
            endGame();
            return;
        }

        let targetNumber = currentChain[targetIndex];
        instructionEl.innerHTML = `Descompón el número: <strong>${targetNumber}</strong>`;

        let validPairs = getDivisorPairs(targetNumber);
        // Escoger un par correcto al azar
        let correctPair = validPairs[Math.floor(Math.random() * validPairs.length)];
        if (Math.random() > 0.5) correctPair = [correctPair[1], correctPair[0]];
        let correctStr = `${correctPair[0]} × ${correctPair[1]}`;

        // Generar distractores
        let options = [{ text: correctStr, isCorrect: true, pair: correctPair }];
        let attempts = 0;

        while(options.length < 4 && attempts < 100) {
            attempts++;
            let offsetA = Math.floor(Math.random() * 5) - 2;
            let offsetB = Math.floor(Math.random() * 5) - 2;
            
            let wrongA = correctPair[0] + offsetA;
            let wrongB = correctPair[1] + offsetB;

            if (wrongA <= 1) wrongA = 2;
            if (wrongB <= 1) wrongB = 2;

            let wrongStr = `${wrongA} × ${wrongB}`;
            
            // Verificar que no sea la respuesta correcta ni esté repetido
            if (wrongA * wrongB !== targetNumber && !options.some(o => o.text === wrongStr)) {
                options.push({ text: wrongStr, isCorrect: false });
            }
        }

        // Mezclar opciones
        options.sort(() => Math.random() - 0.5);

        // Renderizar botones
        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.textContent = opt.text;
            btn.onclick = () => handleAnswer(opt.isCorrect, opt.pair, targetIndex);
            optionsEl.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect, pair, targetIndex) {
        if (isCorrect) {
            feedbackEl.textContent = "¡Excelente!";
            feedbackEl.className = "correct";
            
            // Reemplazar el número compuesto por sus dos factores
            currentChain.splice(targetIndex, 1, pair[0], pair[1]);
            historyStrings.push(currentChain.join(" × "));
            
            updateBoard();
            
            // Bloquear botones
            const buttons = optionsEl.querySelectorAll("button");
            buttons.forEach(b => b.disabled = true);
            
            setTimeout(() => {
                nextTurn();
            }, 1200);
        } else {
            feedbackEl.textContent = "Multiplicación incorrecta. Revisa de nuevo.";
            feedbackEl.className = "incorrect";
        }
    }

    function endGame() {
        instructionEl.textContent = "¡Misión cumplida! Todos son números primos.";
        optionsEl.innerHTML = "";
        
        let initialNum = historyStrings[0];
        let exponentsStr = formatExponents(currentChain);
        
        finalResultEl.innerHTML = `${initialNum} = <span>${exponentsStr}</span>`;
        finalResultEl.style.display = "block";
        restartBtn.style.display = "block";
    }

    // Iniciar el juego al cargar la página
    initGame();
</script>

</body>
</html>
