<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Simuladores - Ingresa</title>
    <style>
        :root {
            --primary-navy: #0A2240; /* Azul marino del trazo */
            --primary-teal: #00D2A0; /* Turquesa del texto */
            --light-bg: #E8F4F8; /* Fondo claro */
            --white: #FFFFFF;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            background-image: linear-gradient(135deg, #E8F4F8 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        #menu-container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 34, 64, 0.15);
            text-align: center;
            max-width: 650px;
            width: 90%;
            border-top: 6px solid var(--primary-teal);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 240px;
            height: auto;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-navy);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .game-card {
            background-color: var(--primary-navy);
            color: var(--white);
            text-decoration: none;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--primary-navy);
        }

        .game-card:hover {
            background-color: var(--white);
            color: var(--primary-navy);
            transform: translateY(-2px);
            border-color: var(--primary-teal);
        }

        .game-card span.icon {
            font-size: 24px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

<div id="menu-container">
    <div class="logo-container">
        <img src="Ingresa_Cicle.jpg" alt="Logo Ingresa">
    </div>
    
    <h1>Centro de Entrenamiento Interactivo</h1>
    <p class="subtitle">Selecciona el simulador o juego matemático que deseas practicar:</p>

    <div class="games-grid">
        <a href="factorizacion.html" class="game-card">
            <span>Factorización de Números</span>
            <span class="icon">🧩</span>
        </a>
        <a href="derivadas.html" class="game-card">
            <span>Fórmulas de Derivadas</span>
            <span class="icon">📈</span>
        </a>
        <a href="integrales.html" class="game-card">
            <span>Fórmulas de Integrales</span>
            <span class="icon">∫</span>
        </a>
        <a href="exponentes.html" class="game-card">
            <span>Leyes de Exponentes y Radicales</span>
            <span class="icon">ⁿ√x</span>
        </a>
        <a href="identidades.html" class="game-card">
            <span>Identidades Trigonométricas</span>
            <span class="icon">📐</span>
        </a>
    </div>

    <div class="footer-note">
        Ingresa &bull; Entrenamiento Académico Especializado
    </div>
</div>

</body>
</html>
