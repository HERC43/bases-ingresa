<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Derivadas - Ingresa</title>
    <style>
        :root {
            --primary-navy: #0A2240; /* Azul marino del trazo */
            --primary-teal: #00D2A0; /* Turquesa del texto */
            --light-bg: #E8F4F8; /* Fondo claro */
            --white: #FFFFFF;
            --text-dark: #333333;
            --error-red: #D32F2F; 
            --success-green: #2E7D32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            background-image: linear-gradient(135deg, #E8F4F8 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        #game-container {
            background-color: var(--white);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 34, 64, 0.15);
            text-align: center;
            max-width: 650px;
            width: 90%;
            border-top: 6px solid var(--primary-teal);
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        #score-board {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-navy);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        #board-container {
            margin-bottom: 25px;
        }

        .formula-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
        }

        #board {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-navy);
            background-color: #F8FBFC;
            border: 2px dashed var(--primary-teal);
            padding: 22px;
            border-radius: 12px;
            word-wrap: break-word;
            letter-spacing: 1px;
        }

        #instruction {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--primary-navy);
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        button {
            background-color: var(--primary-navy);
            color: var(--white);
            border: 2px solid var(--primary-navy);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) {
            background-color: var(--white);
            color: var(--primary-navy);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #B0BEC5;
            border-color: #B0BEC5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
        }

        .correct { color: var(--success-green); }
        .incorrect { color: var(--error-red); }

        #final-screen {
            display: none;
            margin-top: 20px;
        }

        #final-result {
            padding: 20px;
            background-color: var(--primary-navy);
            color: var(--white);
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(10, 34, 64, 0.3);
            margin-bottom: 20px;
        }

        #restart-btn {
            background-color: var(--primary-teal);
            border-color: var(--primary-teal);
            color: var(--primary-navy);
            width: 100%;
        }

        #restart-btn:hover {
            background-color: var(--primary-navy);
            color: var(--primary-teal);
            border-color: var(--primary-navy);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="logo-container">
        <img src="Ingresa_Cicle.jpg" alt="Logo Ingresa">
    </div>

    <div id="game-play-area">
        <div id="score-board">
            <span id="current-question">Pregunta: 1 / 8</span>
            <span id="current-score">Aciertos: 0</span>
        </div>
        
        <div id="board-container">
            <div class="formula-label">¿Cuál es el resultado de la siguiente derivada?</div>
            <div id="board"></div>
        </div>
        
        <div id="instruction">Selecciona la fórmula o resultado correcto:</div>
        <div class="options-grid" id="options"></div>
        <div id="feedback"></div>
    </div>
    
    <div id="final-screen">
        <div id="final-result"></div>
        <button id="restart-btn" onclick="initGame()">Jugar de Nuevo</button>
    </div>
</div>

<script>
    // Base de datos completa de fórmulas de derivadas
    const derivativesData = [
        // Algebraicas y básicas
        {
            question: "d/dx ( c )",
            correct: "0",
            distractors: ["1", "c", "x", "c'"]
        },
        {
            question: "d/dx ( x )",
            correct: "1",
            distractors: ["0", "x", "x²", "1/x"]
        },
        {
            question: "d/dx ( xⁿ )",
            correct: "n · xⁿ⁻¹",
            distractors: ["n · xⁿ", "n⁻¹ · xⁿ", "xⁿ⁻¹", "n · xⁿ⁺¹"]
        },
        {
            question: "d/dx ( u + v )",
            correct: "u' + v'",
            distractors: ["u' · v'", "u' - v'", "u' / v'", "u · v' + u' · v"]
        },
        {
            question: "d/dx ( c · u )",
            correct: "c · u'",
            distractors: ["0", "c' · u'", "c · u + c' · u", "u' / c"]
        },
        {
            question: "d/dx ( u · v )",
            correct: "u · v' + v · u'",
            distractors: ["u' · v'", "u' · v + v'", "u · v'", "(u' · v') / 2"]
        },
        {
            question: "d/dx ( u / v )",
            correct: "(v · u' - u · v') / v²",
            distractors: ["(u' · v - v' · u) / u²", "u' / v'", "(u · v' + v · u') / v²", "u' · v - v' · u"]
        },
        // Exponenciales y Logarítmicas
        {
            question: "d/dx ( eᵘ )",
            correct: "eᵘ · u'",
            distractors: ["eᵘ", "u · eᵘ⁻¹", "eᵘ / u'", "ln(u) · u'"]
        },
        {
            question: "d/dx ( aᵘ )",
            correct: "aᵘ · ln(a) · u'",
            distractors: ["aᵘ · u'", "aᵘ / ln(a)", "ln(a) · u'", "a · uᵃ⁻¹ · u'"]
        },
        {
            question: "d/dx ( ln u )",
            correct: "u' / u",
            distractors: ["1 / u", "u / u'", "eᵘ · u'", "u' · ln(u)"]
        },
        {
            question: "d/dx ( logₐ u )",
            correct: "u' / (u · ln(a))",
            distractors: ["u' / u", "ln(a) / u'", "u · ln(a) · u'", "1 / (u · ln(a))"]
        },
        // Trigonométricas directas
        {
            question: "d/dx ( sin u )",
            correct: "cos(u) · u'",
            distractors: ["-cos(u) · u'", "sin(u) · u'", "-sin(u) · u'", "tan(u) · u'"]
        },
        {
            question: "d/dx ( cos u )",
            correct: "-sin(u) · u'",
            distractors: ["sin(u) · u'", "cos(u) · u'", "-cos(u) · u'", "sec²(u) · u'"]
        },
        {
            question: "d/dx ( tan u )",
            correct: "sec²(u) · u'",
            distractors: ["csc²(u) · u'", "sec(u) · tan(u) · u'", "-sec²(u) · u'", "cos²(u) · u'"]
        },
        {
            question: "d/dx ( cot u )",
            correct: "-csc²(u) · u'",
            distractors: ["sec²(u) · u'", "-csc(u) · cot(u) · u'", "csc²(u) · u'", "-tan²(u) · u'"]
        },
        {
            question: "d/dx ( sec u )",
            correct: "sec(u) · tan(u) · u'",
            distractors: ["sec²(u) · u'", "-sec(u) · tan(u) · u'", "csc(u) · cot(u) · u'", "sec(u) / u'"]
        },
        {
            question: "d/dx ( csc u )",
            correct: "-csc(u) · cot(u) · u'",
            distractors: ["csc²(u) · u'", "csc(u) · cot(u) · u'", "-sec(u) · tan(u) · u'", "-csc(u) / u'"]
        },
        // Trigonométricas inversas (Los 6 arcos)
        {
            question: "d/dx ( arcsin u )",
            correct: "u' / √(1 - u²)",
            distractors: ["-u' / √(1 - u²)", "u' / (1 + u²)", "-u' / (1 + u²)", "1 / √(1 - u²)"]
        },
        {
            question: "d/dx ( arccos u )",
            correct: "-u' / √(1 - u²)",
            distractors: ["u' / √(1 - u²)", "-u' / (1 + u²)", "u' / (1 + u²)", "-1 / √(1 - u²)"]
        },
        {
            question: "d/dx ( arctan u )",
            correct: "u' / (1 + u²)",
            distractors: ["-u' / (1 + u²)", "u' / √(1 - u²)", "u' / (1 - u²)", "1 / (1 + u²)"]
        },
        {
            question: "d/dx ( arccot u )",
            correct: "-u' / (1 + u²)",
            distractors: ["u' / (1 + u²)", "-u' / √(1 - u²)", "-u' / (u² - 1)", "-1 / (1 + u²)"]
        },
        {
            question: "d/dx ( arcsec u )",
            correct: "u' / (|u| √(u² - 1))",
            distractors: ["-u' / (|u| √(u² - 1))", "u' / (u √(1 - u²))", "u' / (1 + u²)", "1 / (u √(u² - 1))"]
        },
        {
            question: "d/dx ( arccsc u )",
            correct: "-u' / (|u| √(u² - 1))",
            distractors: ["u' / (|u| √(u² - 1))", "-u' / (u √(1 - u²))", "-u' / (1 + u²)", "-1 / (u √(u² - 1))"]
        }
    ];

    let questionsList = [];
    let currentIndex = 0;
    let score = 0;
    const totalRounds = 12; // Preguntas por partida

    const boardEl = document.getElementById("board");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const questionCounterEl = document.getElementById("current-question");
    const scoreCounterEl = document.getElementById("current-score");
    const gamePlayArea = document.getElementById("game-play-area");
    const finalScreen = document.getElementById("final-screen");
    const finalResultEl = document.getElementById("final-result");

    function initGame() {
        gamePlayArea.style.display = "block";
        finalScreen.style.display = "none";
        currentIndex = 0;
        score = 0;
        
        // Mezclar y seleccionar un subconjunto de preguntas para la partida
        questionsList = [...derivativesData].sort(() => Math.random() - 0.5).slice(0, totalRounds);
        
        loadQuestion();
    }

    function loadQuestion() {
        feedbackEl.textContent = "";
        feedbackEl.className = "";
        optionsEl.innerHTML = "";

        if (currentIndex >= questionsList.length) {
            endGame();
            return;
        }

        questionCounterEl.textContent = `Pregunta: ${currentIndex + 1} / ${totalRounds}`;
        scoreCounterEl.textContent = `Aciertos: ${score}`;

        const currentQ = questionsList[currentIndex];
        boardEl.textContent = currentQ.question;

        // Preparar opciones (correcta + distractores)
        let choices = [{ text: currentQ.correct, isCorrect: true }];
        
        // Tomar 3 distractores al azar de esa pregunta
        let shuffledDistractors = [...currentQ.distractors].sort(() => Math.random() - 0.5).slice(0, 3);
        shuffledDistractors.forEach(d => {
            choices.push({ text: d, isCorrect: false });
        });

        // Mezclar las opciones en los botones
        choices.sort(() => Math.random() - 0.5);

        // Renderizar botones
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.textContent = choice.text;
            btn.onclick = () => handleAnswer(choice.isCorrect, btn);
            optionsEl.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect, selectedBtn) {
        const buttons = optionsEl.querySelectorAll("button");
        buttons.forEach(b => b.disabled = true); // Bloquear para evitar doble clic

        if (isCorrect) {
            feedbackEl.textContent = "¡Correcto!";
            feedbackEl.className = "correct";
            selectedBtn.style.backgroundColor = "var(--success-green)";
            selectedBtn.style.color = "white";
            score++;
            scoreCounterEl.textContent = `Aciertos: ${score}`;
        } else {
            feedbackEl.textContent = "Incorrecto.";
            feedbackEl.className = "incorrect";
            selectedBtn.style.backgroundColor = "var(--error-red)";
            selectedBtn.style.color = "white";
            
            // Mostrar cuál era la correcta
            buttons.forEach(b => {
                if (b.textContent === questionsList[currentIndex].correct) {
                    b.style.backgroundColor = "var(--success-green)";
                    b.style.color = "white";
                }
            });
        }

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1500);
    }

    function endGame() {
        gamePlayArea.style.display = "none";
        finalScreen.style.display = "block";
        
        let mensaje = "";
        if (score === totalRounds) {
            mensaje = `¡Perfecto! ${score} de ${score} aciertos. ¡Dominas las derivadas a la perfección!`;
        } else if (score >= totalRounds / 2) {
            mensaje = `¡Muy bien! Obtuviste ${score} de ${totalRounds} aciertos. ¡Sigue repasando!`;
        } else {
            mensaje = `Obtuviste ${score} de ${totalRounds} aciertos. ¡A repasar las fórmulas de derivación!`;
        }

        finalResultEl.innerHTML = mensaje;
    }

    // Iniciar el juego al cargar
    initGame();
</script>

</body>
</html>
