<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Identidades Trigonométricas - Ingresa</title>
    <style>
        :root {
            --primary-navy: #0A2240; /* Azul marino del trazo */
            --primary-teal: #00D2A0; /* Turquesa del texto */
            --light-bg: #E8F4F8; /* Fondo claro */
            --white: #FFFFFF;
            --text-dark: #333333;
            --error-red: #D32F2F; 
            --success-green: #2E7D32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            background-image: linear-gradient(135deg, #E8F4F8 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        #game-container {
            background-color: var(--white);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 34, 64, 0.15);
            text-align: center;
            max-width: 650px;
            width: 90%;
            border-top: 6px solid var(--primary-teal);
            position: relative;
        }

        .back-menu {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--primary-navy);
            font-weight: bold;
            font-size: 14px;
            background: var(--light-bg);
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .back-menu:hover {
            background: var(--primary-teal);
            color: var(--primary-navy);
        }

        .logo-container {
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        #score-board {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-navy);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        #board-container {
            margin-bottom: 25px;
        }

        .formula-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
        }

        #board {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-navy);
            background-color: #F8FBFC;
            border: 2px dashed var(--primary-teal);
            padding: 22px;
            border-radius: 12px;
            word-wrap: break-word;
            letter-spacing: 1px;
        }

        #instruction {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--primary-navy);
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        button {
            background-color: var(--primary-navy);
            color: var(--white);
            border: 2px solid var(--primary-navy);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) {
            background-color: var(--white);
            color: var(--primary-navy);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #B0BEC5;
            border-color: #B0BEC5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
        }

        .correct { color: var(--success-green); }
        .incorrect { color: var(--error-red); }

        #final-screen {
            display: none;
            margin-top: 20px;
        }

        #final-result {
            padding: 20px;
            background-color: var(--primary-navy);
            color: var(--white);
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(10, 34, 64, 0.3);
            margin-bottom: 15px;
        }

        .end-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            font-size: 18px;
            padding: 12px;
        }

        #restart-btn {
            background-color: var(--primary-teal);
            border-color: var(--primary-teal);
            color: var(--primary-navy);
        }

        #restart-btn:hover {
            background-color: var(--primary-navy);
            color: var(--primary-teal);
            border-color: var(--primary-navy);
        }

        #menu-btn {
            background-color: var(--primary-navy);
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid var(--primary-navy);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #menu-btn:hover {
            background-color: var(--white);
            color: var(--primary-navy);
        }
    </style>
</head>
<body>

<div id="game-container">
    <a href="index.html" class="back-menu">← Menú</a>

    <div class="logo-container">
        <img src="Ingresa_Cicle.jpg" alt="Logo Ingresa">
    </div>

    <div id="game-play-area">
        <div id="score-board">
            <span id="current-question">Pregunta: 1 / 10</span>
            <span id="current-score">Aciertos: 0</span>
        </div>
        
        <div id="board-container">
            <div class="formula-label">¿A qué identidad es equivalente?</div>
            <div id="board"></div>
        </div>
        
        <div id="instruction">Selecciona la equivalencia correcta:</div>
        <div class="options-grid" id="options"></div>
        <div id="feedback"></div>
    </div>
    
    <div id="final-screen">
        <div id="final-result"></div>
        <div class="end-buttons">
            <button id="restart-btn" class="btn-action" onclick="initGame()">Jugar de Nuevo</button>
            <a href="index.html" id="menu-btn" class="btn-action">Menú Principal</a>
        </div>
    </div>
</div>

<script>
    // Base de datos de identidades trigonométricas
    const trigData = [
        // Recíprocas
        {
            question: "csc(θ)",
            correct: "1 / sin(θ)",
            distractors: ["1 / cos(θ)", "sin(θ)", "1 / tan(θ)", "-sin(θ)"]
        },
        {
            question: "sec(θ)",
            correct: "1 / cos(θ)",
            distractors: ["1 / sin(θ)", "cos(θ)", "1 / cot(θ)", "-cos(θ)"]
        },
        {
            question: "cot(θ)",
            correct: "1 / tan(θ)",
            distractors: ["1 / sin(θ)", "tan(θ)", "1 / cos(θ)", "-cot(θ)"]
        },
        // Cociente
        {
            question: "tan(θ)",
            correct: "sin(θ) / cos(θ)",
            distractors: ["cos(θ) / sin(θ)", "1 / sin(θ)", "sin²(θ)", "sec(θ)"]
        },
        {
            question: "cot(θ)",
            correct: "cos(θ) / sin(θ)",
            distractors: ["sin(θ) / cos(θ)", "1 / cos(θ)", "csc(θ)", "tan(θ)"]
        },
        // Pitagóricas
        {
            question: "sin²(θ) + cos²(θ)",
            correct: "1",
            distractors: ["0", "tan²(θ)", "sec²(θ)", "2"]
        },
        {
            question: "1 + tan²(θ)",
            correct: "sec²(θ)",
            distractors: ["csc²(θ)", "cot²(θ)", "1", "sin²(θ)"]
        },
        {
            question: "1 + cot²(θ)",
            correct: "csc²(θ)",
            distractors: ["sec²(θ)", "tan²(θ)", "1", "cos²(θ)"]
        },
        // Ángulo Doble
        {
            question: "sin(2θ)",
            correct: "2 sin(θ) cos(θ)",
            distractors: ["cos²(θ) - sin²(θ)", "2 cos²(θ)", "1 - 2 sin²(θ)", "2 tan(θ) / (1 - tan²(θ))"]
        },
        {
            question: "cos(2θ)",
            correct: "cos²(θ) - sin²(θ)",
            distractors: ["2 sin(θ) cos(θ)", "2 cos²(θ) + 1", "sin²(θ) - cos²(θ)", "1 - sin(2θ)"]
        },
        {
            question: "tan(2θ)",
            correct: "2 tan(θ) / (1 - tan²(θ))",
            distractors: ["2 tan(θ) / (1 + tan²(θ))", "tan²(θ) / 2", "2 / (1 - tan(θ))", "1 / tan²(θ)"]
        },
        // Ángulo Mitad
        {
            question: "sin²(θ / 2)",
            correct: "(1 - cos(θ)) / 2",
            distractors: ["(1 + cos(θ)) / 2", "(1 - sin(θ)) / 2", "cos²(θ / 2)", "1 - cos(θ)"]
        },
        {
            question: "cos²(θ / 2)",
            correct: "(1 + cos(θ)) / 2",
            distractors: ["(1 - cos(θ)) / 2", "(1 + sin(θ)) / 2", "sin²(θ / 2)", "1 + cos(θ)"]
        }
    ];

    let questionsList = [];
    let currentIndex = 0;
    let score = 0;
    const totalRounds = 10; // Preguntas por partida

    const boardEl = document.getElementById("board");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const questionCounterEl = document.getElementById("current-question");
    const scoreCounterEl = document.getElementById("current-score");
    const gamePlayArea = document.getElementById("game-play-area");
    const finalScreen = document.getElementById("final-screen");
    const finalResultEl = document.getElementById("final-result");

    function initGame() {
        gamePlayArea.style.display = "block";
        finalScreen.style.display = "none";
        currentIndex = 0;
        score = 0;
        
        // Mezclar y seleccionar un subconjunto de preguntas para la partida
        questionsList = [...trigData].sort(() => Math.random() - 0.5).slice(0, totalRounds);
        
        loadQuestion();
    }

    function loadQuestion() {
        feedbackEl.textContent = "";
        feedbackEl.className = "";
        optionsEl.innerHTML = "";

        if (currentIndex >= questionsList.length) {
            endGame();
            return;
        }

        questionCounterEl.textContent = `Pregunta: ${currentIndex + 1} / ${totalRounds}`;
        scoreCounterEl.textContent = `Aciertos: ${score}`;

        const currentQ = questionsList[currentIndex];
        boardEl.textContent = currentQ.question;

        // Preparar opciones (correcta + distractores)
        let choices = [{ text: currentQ.correct, isCorrect: true }];
        
        // Tomar 3 distractores al azar de esa pregunta
        let shuffledDistractors = [...currentQ.distractors].sort(() => Math.random() - 0.5).slice(0, 3);
        shuffledDistractors.forEach(d => {
            choices.push({ text: d, isCorrect: false });
        });

        // Mezclar las opciones en los botones
        choices.sort(() => Math.random() - 0.5);

        // Renderizar botones
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.textContent = choice.text;
            btn.onclick = () => handleAnswer(choice.isCorrect, btn);
            optionsEl.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect, selectedBtn) {
        const buttons = optionsEl.querySelectorAll("button");
        buttons.forEach(b => b.disabled = true); // Bloquear para evitar doble clic

        if (isCorrect) {
            feedbackEl.textContent = "¡Correcto!";
            feedbackEl.className = "correct";
            selectedBtn.style.backgroundColor = "var(--success-green)";
            selectedBtn.style.color = "white";
            score++;
            scoreCounterEl.textContent = `Aciertos: ${score}`;
        } else {
            feedbackEl.textContent = "Incorrecto.";
            feedbackEl.className = "incorrect";
            selectedBtn.style.backgroundColor = "var(--error-red)";
            selectedBtn.style.color = "white";
            
            // Mostrar cuál era la correcta
            buttons.forEach(b => {
                if (b.textContent === questionsList[currentIndex].correct) {
                    b.style.backgroundColor = "var(--success-green)";
                    b.style.color = "white";
                }
            });
        }

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1500);
    }

    function endGame() {
        gamePlayArea.style.display = "none";
        finalScreen.style.display = "block";
        
        let mensaje = "";
        if (score === totalRounds) {
            mensaje = `¡Excelente! ${score} de ${score} aciertos. ¡Dominas la trigonometría por completo!`;
        } else if (score >= totalRounds / 2) {
            mensaje = `¡Muy bien! Obtuviste ${score} de ${totalRounds} aciertos. ¡Sigue practicando!`;
        } else {
            mensaje = `Obtuviste ${score} de ${totalRounds} aciertos. ¡A repasar las identidades trigonométricas!`;
        }

        finalResultEl.innerHTML = mensaje;
    }

    // Iniciar el juego al cargar
    initGame();
</script>

</body>
</html>
